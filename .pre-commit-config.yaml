# .pre-commit-config.yaml · 提交前自动检查
#
# 一次性安装(每个开发机器):
#   pip install pre-commit
#   pre-commit install --hook-type pre-commit --hook-type commit-msg
#
# 见 CLAUDE.md「🪝 自动化检查」节。

repos:
  # ── 基础卫生 ──
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=2048']
      - id: check-case-conflict

  # ── 项目专属检查 ──
  - repo: local
    hooks:
      # 阻止硬编码(违反 CLAUDE.md 代码硬规矩 14)
      # 只抓具体危险字面值,不抓 `password = ...`(会误伤正常表单字段)
      - id: no-hard-coded-secrets
        name: "硬编码检查 (localhost:端口 / 用户路径 / 演示密码)"
        entry: bash
        args:
          - -c
          - |
            if grep -rEn "(localhost:[0-9]{4,5}|/Users/[A-Za-z]+/[A-Za-z]+/|Ridemall@Demo2026)" \
                --include="*.py" --include="*.kt" \
                --exclude-dir=".venv" --exclude-dir="build" \
                --exclude-dir="node_modules" --exclude-dir=".gradle" \
                . 2>/dev/null; then
              echo ""
              echo "❌ 发现硬编码,违反 CLAUDE.md 代码硬规矩 14"
              echo "   请走配置:env / config.py / BuildConfig"
              exit 1
            fi
        language: system
        pass_filenames: false
        stages: [pre-commit]

      # 路径声明检查(违反 CLAUDE.md 代码硬规矩 16)
      # 新文件所在目录必须**精确**出现在 docs/.path-whitelist(整行匹配),
      # 不再用子串撞名;android res/ 框架目录特例放行。
      - id: path-must-be-declared
        name: "新文件目录必须在 docs/.path-whitelist 声明"
        entry: bash
        args:
          - -c
          - |
            fails=0
            wl="docs/.path-whitelist"
            new_files=$(git diff --cached --name-only --diff-filter=A 2>/dev/null \
              | grep -E "^(server|android|deploy)/" \
              | grep -vE "(\.gitkeep|_README\.md)$" || true)
            for f in $new_files; do
              dir=$(dirname "$f")
              case "$dir" in
                android/app/src/main/res*) continue ;;  # Gradle 框架资源目录,放行
              esac
              if grep -vE '^[[:space:]]*(#|$)' "$wl" | grep -qxF "$dir"; then
                continue
              fi
              echo ""
              echo "❌ 新文件 $f"
              echo "   目录 '$dir' 不在 docs/.path-whitelist"
              echo "   → 先在 .path-whitelist 加一行 '$dir' + 同步 docs/architecture/ 分册,再 commit"
              fails=1
            done
            exit $fails
        language: system
        pass_filenames: false
        stages: [pre-commit]

      # architecture 文档改了正文 → 修订记录必须 bump(违反则 block)
      - id: architecture-revision-bump
        name: "改 architecture 文档必须更新修订记录"
        entry: bash
        args:
          - -c
          - |
            fails=0
            changed=$(git diff --cached --name-only --diff-filter=M 2>/dev/null \
              | grep -E "^docs/architecture(/[a-z]+)?\.md$" || true)
            for f in $changed; do
              if ! git diff --cached "$f" | grep -qE "^\+.*[Vv][0-9]+(\.[0-9]+)?"; then
                echo ""
                echo "❌ $f 改了正文但修订记录没 bump"
                echo "   → 在文件顶部「修订记录」加一行新版本号"
                fails=1
              fi
            done
            exit $fails
        language: system
        pass_filenames: false
        stages: [pre-commit]

      # commit message 格式校验(必须 [C_n 状态] 或 [M_n 状态])
      - id: commit-msg-format
        name: "commit message 格式 [C_n|M_n 状态]"
        entry: bash
        args:
          - -c
          - |
            msg=$(head -1 "$1")
            if ! echo "$msg" | grep -qE "^\[(C[0-9]+|M[0-9]+) (开工|wip|done)\]"; then
              echo ""
              echo "❌ commit message 第一行必须以 [C_n 状态] 或 [M_n 状态] 开头"
              echo "   状态枚举:开工 / wip / done"
              echo "   例:[C3 done] categories CRUD (US-ADMIN-03)"
              echo "      [M0 done] initial docs scaffold"
              exit 1
            fi
            # C_n 切片 commit 必须带故事 ID;M_n 里程碑 commit 豁免
            if echo "$msg" | grep -qE "^\[C[0-9]+ " \
               && ! echo "$msg" | grep -qE "\(US-[A-Z]+-[0-9]+"; then
              echo ""
              echo "❌ C_n 切片 commit 必须带故事 ID,如 (US-ADMIN-03)"
              echo "   当前:$msg"
              exit 1
            fi
        language: system
        stages: [commit-msg]

      # 代码 ⟹ 文档 闸门(补 CLAUDE.md「文档同步」的机械缺口)
      # 改了 server/ 或 android/ 的 .py/.kt,本次提交里必须同时有 .md,
      # 否则 block;确属无需改文档的提交,在 message 写 [doc-skip: 原因] 豁免。
      - id: code-requires-doc
        name: "改代码必须同提交带文档(否则 [doc-skip: 原因])"
        entry: bash
        args:
          - -c
          - |
            msg=$(head -1 "$1")
            # 豁免:message 显式声明 [doc-skip: 原因]
            if echo "$msg" | grep -qE "\[doc-skip:[^]]+\]"; then
              exit 0
            fi
            staged=$(git diff --cached --name-only 2>/dev/null || true)
            code_changed=$(echo "$staged" | grep -E "^(server|android)/.*\.(py|kt)$" || true)
            if [ -z "$code_changed" ]; then
              exit 0
            fi
            doc_changed=$(echo "$staged" | grep -E "\.md$" || true)
            if [ -n "$doc_changed" ]; then
              exit 0
            fi
            echo ""
            echo "❌ 本次提交改了代码(server/ 或 android/ 的 .py/.kt)但没有同提交的文档(.md)"
            echo "   CLAUDE.md「文档同步」要求 API/架构/行为变更同提交更新文档"
            echo "   → 要么补上相应 .md;要么确属无需文档的提交,在 message 写 [doc-skip: 原因]"
            echo "   改动的代码文件:"
            echo "$code_changed" | sed 's/^/     /'
            exit 1
        language: system
        stages: [commit-msg]

      # 两锚校验闸门(把 CLAUDE.md「两锚一致」从人为纪律变机械阻断)
      # [C_n 开工] / [C_n done] 必须同提交带 docs/story-map.md(故事状态锚同步)
      - id: slice-state-needs-storymap
        name: "[C_n 开工|done] 必须同提交更新 story-map.md"
        entry: bash
        args:
          - -c
          - |
            msg=$(head -1 "$1")
            if echo "$msg" | grep -qE "^\[C[0-9]+ (开工|done)\]"; then
              staged=$(git diff --cached --name-only 2>/dev/null || true)
              if ! echo "$staged" | grep -qxF "docs/story-map.md"; then
                echo ""
                echo "❌ [C_n 开工|done] 提交必须同时更新 docs/story-map.md(两锚:故事状态)"
                echo "   开工 → 故事置 🟡;done → 故事置 ✅"
                echo "   当前:$msg"
                exit 1
              fi
            fi
        language: system
        stages: [commit-msg]

      # [C_n done] 必须同提交带 docs/wip.md(切片完整性:无遗留半成品)
      - id: done-needs-clean-wip
        name: "[C_n done] 必须同提交更新 wip.md"
        entry: bash
        args:
          - -c
          - |
            msg=$(head -1 "$1")
            if echo "$msg" | grep -qE "^\[C[0-9]+ done\]"; then
              staged=$(git diff --cached --name-only 2>/dev/null || true)
              if ! echo "$staged" | grep -qxF "docs/wip.md"; then
                echo ""
                echo "❌ [C_n done] 提交必须同时更新 docs/wip.md(切片完整性:清掉本片遗留条目)"
                echo "   当前:$msg"
                exit 1
              fi
            fi
        language: system
        stages: [commit-msg]

